[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apoptotic-wildfire"
version = "0.1.0"
description = "Wildfire participation-control experiments"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "pyyaml",
  "matplotlib",
  "seaborn",
  "scipy",
  "tqdm",
  "pyarrow",
  "pillow",
  "opencv-python",
]

[tool.setuptools.packages.find]
include = ["src*"]
